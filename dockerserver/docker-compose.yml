services:
  postgresOdoo16:
    image: postgres:15
    container_name: helipistas_postgres
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: helipistas@2025
      POSTGRES_DB: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - /efs/HELIPISTAS-ODOO-17/postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - helipistas_network
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  helipistas_odoo:
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: helipistas_odoo
    depends_on:
      - postgresOdoo16
    environment:
      HOST: postgresOdoo16
      USER: odoo
      PASSWORD: helipistas@2025
      ODOO_LONGPOLLING_PORT: 8072
      LANG: es_ES.UTF-8
      LANGUAGE: es_ES:es
      LC_ALL: es_ES.UTF-8
    volumes:
      - /efs/HELIPISTAS-ODOO-17/odoo/conf:/etc/odoo
      - /efs/HELIPISTAS-ODOO-17/odoo/addons/helipistas-erp-odoo-17/addons:/mnt/extra-addons
      - /efs/HELIPISTAS-ODOO-17/odoo/filestore:/var/lib/odoo/filestore
      - /efs/HELIPISTAS-ODOO-17/odoo/sessiones:/var/lib/odoo/sessions
    ports:
      - "8069:8069"
      - "8082:8082"
      - "8072:8072"
    restart: unless-stopped
    networks:
      - helipistas_network
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:latest
    container_name: helipistas_nginx
    depends_on:
      - helipistas_odoo
      - helipistas_n8n
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /efs/HELIPISTAS-ODOO-17/nginx/conf/default.conf:/etc/nginx/conf.d/default.conf
      - /efs/HELIPISTAS-ODOO-17/nginx/ssl:/etc/nginx/ssl
      - /efs/HELIPISTAS-ODOO-17/certbot/www:/var/www/certbot
      - /efs/HELIPISTAS-ODOO-17/certbot/conf:/etc/letsencrypt
    restart: unless-stopped
    networks:
      - helipistas_network
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  certbot:
    image: certbot/certbot
    container_name: helipistas_certbot
    volumes:
      - /efs/HELIPISTAS-ODOO-17/certbot/www:/var/www/certbot
      - /efs/HELIPISTAS-ODOO-17/certbot/conf:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - helipistas_network

  helipistas_n8n:
    image: helipistas/n8n:1.0.0
    container_name: helipistas_n8n
    restart: unless-stopped
    depends_on:
      - postgresOdoo16
    ports:
      - "5678:5678"
    environment:
      # Database
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgresOdoo16
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=odoo
      - DB_POSTGRESDB_PASSWORD=helipistas@2025

      # N8N Authentication
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=1HelipistasN8n@

      # N8N Core
      - N8N_HOST=n8n.helipistas.com
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://n8n.helipistas.com/
      - N8N_ENCRYPTION_KEY=5ae2735ff5f5b6e95664bd2becde65aea001910a2d3d90f267dea0ab6aa61e66

      # Timezone
      - GENERIC_TIMEZONE=Europe/Madrid
      - TZ=Europe/Madrid

      # Execution
      - EXECUTIONS_PROCESS=main
      - EXECUTIONS_DATA_SAVE_ON_ERROR=all
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=all
      - EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS=true
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=336

      # Logs & Features
      - N8N_LOG_LEVEL=info
      - N8N_LOG_OUTPUT=console
      - N8N_COMMUNITY_PACKAGES_ENABLED=true
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_HIRING_BANNER_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
    volumes:
      - /efs/HELIPISTAS-ODOO-17/n8n/data:/home/node/.n8n
      - /efs/HELIPISTAS-ODOO-17/n8n/backups:/home/node/backups
    networks:
      - helipistas_network
    healthcheck:
      test: ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://localhost:5678/healthz || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      options:
        max-size: "50m"
        max-file: "3"

  metabase:
    image: metabase/metabase:latest
    container_name: metabase_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - postgresOdoo16
    environment:
      - MB_DB_TYPE=postgres
      - MB_DB_HOST=postgresOdoo16
      - MB_DB_PORT=5432
      - MB_DB_DBNAME=metabase_config
      - MB_DB_USER=odoo
      - MB_DB_PASS=helipistas@2025
      - JAVA_OPTS=-Xmx1024m
      - MB_SITE_LOCALE=es
      - MB_SITE_URL=https://metabase.helipistas.com
    networks:
      - helipistas_network

networks:
  helipistas_network:
    driver: bridge
